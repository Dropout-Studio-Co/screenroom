name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Rust and TV checks
    runs-on: [self-hosted, macOS]
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Put the owner's toolchains on PATH
        run: |
          for directory in /opt/homebrew/bin /usr/local/bin "$HOME/.cargo/bin"; do
            if [ -d "$directory" ]; then
              printf '%s\n' "$directory" >>"$GITHUB_PATH"
            fi
          done

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Report tool versions
        run: |
          cargo --version
          rustc --version
          cargo fmt --version
          cargo clippy --version
          node --version
          pnpm --version

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - name: No comments
        run: python3 scripts/no_comments.py check

      - name: Install TV dependencies
        working-directory: apps/tv
        run: pnpm install --frozen-lockfile

      - name: TV typecheck
        working-directory: apps/tv
        run: pnpm typecheck

      - name: TV tests
        working-directory: apps/tv
        run: pnpm test
