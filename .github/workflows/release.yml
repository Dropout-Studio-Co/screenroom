name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Create or update the GitHub Release for the version in Cargo.toml
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci-linux.yml

  macos:
    name: macOS package
    needs: ci
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0

      - name: Install the libraries the media build links against
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install libass meson ninja

      - name: Fetch the pinned update framework
        run: scripts/fetch-sparkle.sh

      - name: Cache the redistributable media stack
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: vendor/lgpl
          key: lgpl-media-${{ runner.os }}-${{ hashFiles('scripts/build-lgpl-media.sh') }}

      - name: Build the redistributable media stack
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          if [ -f vendor/lgpl/prefix/lib/libmpv.2.dylib ]; then
            printf 'restored the LGPL media stack from cache\n'
            exit 0
          fi
          scripts/build-lgpl-media.sh

      - name: Name the release this run carries
        id: release
        run: |
          version="$(scripts/release.sh version)"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$version"
          fi
          printf 'version=%s\n' "$version" >>"$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$tag" >>"$GITHUB_OUTPUT"
          printf 'building %s for %s\n' "$version" "$tag"

      - name: Build the application and its manifest fragment
        env:
          SCREENROOM_REQUIRE_SELF_CONTAINED: "1"
        run: scripts/release.sh macos --out artifacts

      - name: Keep the media source with the release
        run: |
          staging="$RUNNER_TEMP/media-source"
          rm -rf "$staging"
          mkdir -p "$staging/downloads"
          cp vendor/lgpl/BUILD_INFO "$staging/"
          cp vendor/lgpl/downloads/ffmpeg.tar.xz "$staging/downloads/"
          cp vendor/lgpl/downloads/mpv.tar.gz "$staging/downloads/"
          cp vendor/lgpl/downloads/libplacebo.tar.gz "$staging/downloads/"
          cp scripts/build-lgpl-media.sh "$staging/"
          tar -cJf artifacts/Screenroom-media-source.tar.xz -C "$staging" .
          printf 'media source bundle: %s bytes\n' "$(stat -f%z artifacts/Screenroom-media-source.tar.xz)"

      - name: Sign the update feed
        env:
          SCREENROOM_SPARKLE_ED_KEY: ${{ secrets.SCREENROOM_SPARKLE_ED_KEY }}
        run: scripts/release.sh appcast --out artifacts --tag "${{ steps.release.outputs.tag }}"

      - name: Keep the artefacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows package
    needs: ci
    if: vars.SCREENROOM_WINDOWS_RUNNER == 'true'
    runs-on: [self-hosted, windows]
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0

      - name: Build the release binary
        run: cargo build --release -p screenroom-desktop

      - name: Stage the artefact and its manifest fragment
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $inside = $false
          $version = $null
          foreach ($line in Get-Content Cargo.toml) {
            if ($line -match '^\[workspace\.package\]') { $inside = $true; continue }
            if ($line -match '^\[') { $inside = $false }
            if ($inside -and $line -match '^version\s*=\s*"(.+)"') { $version = $Matches[1]; break }
          }
          if (-not $version) { throw "could not read the workspace version from Cargo.toml" }
          $stage = "dist/windows"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          New-Item -ItemType Directory -Force -Path "artifacts" | Out-Null
          Copy-Item "target/release/screenroom-desktop.exe" "$stage/"
          Get-ChildItem "target/release" -Filter "*.dll" -File |
            Where-Object { $_.Name -match '^(libmpv|mpv|avcodec|avformat|avutil|avfilter|swscale|swresample|ffmpeg)' } |
            Copy-Item -Destination $stage
          $name = "Screenroom-$version-windows-x64.zip"
          $zip = "artifacts/$name"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$stage/*" -DestinationPath $zip
          $digest = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item $zip).Length
          $fragment = @{
            artifacts = @(
              @{
                platform = "windows"
                arch = "x64"
                version = $version
                filename = $name
                sha256 = $digest
                size = $size
              }
            )
          }
          $json = $fragment | ConvertTo-Json -Depth 6
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText((Join-Path $PWD "artifacts/manifest-windows-x64.json"), $json, $utf8)
          Write-Output "artefact $zip"
          Write-Output "sha256 $digest"

      - name: Keep the artefacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

  tv:
    name: Samsung TV package
    needs: ci
    if: vars.SCREENROOM_DEPLOY_TV == 'true'
    runs-on: [self-hosted, macOS]
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Put the owner's toolchains on PATH
        run: |
          for directory in /opt/homebrew/bin /usr/local/bin "$HOME/.cargo/bin"; do
            if [ -d "$directory" ]; then
              printf '%s\n' "$directory" >>"$GITHUB_PATH"
            fi
          done

      - name: Build, sign and install only when the set is reachable
        env:
          SCREENROOM_SHIP_STRICT: "1"
        run: scripts/ship.sh --only tv

  publish:
    name: Publish the release
    needs: [macos, windows]
    if: |
      !cancelled()
      && needs.macos.result == 'success'
      && (needs.windows.result == 'success' || needs.windows.result == 'skipped')
      && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Collect the artefacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: artifacts
          merge-multiple: true

      - name: Check the tag matches the version this run built
        run: |
          version="$(scripts/release.sh version)"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            printf 'the tag %s does not match the version in Cargo.toml (v%s)\n' \
              "$GITHUB_REF_NAME" "$version" >&2
            exit 1
          fi

      - name: Refuse a version that goes backwards
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(scripts/release.sh version)"
          latest="$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // ""')"
          if [ -z "$latest" ]; then
            printf 'no release has been published yet; %s bootstraps the feed\n' "$tag"
            exit 0
          fi
          if [ "$latest" = "$tag" ]; then
            printf '%s is already published; this run may only add byte-identical assets\n' "$tag"
            exit 0
          fi
          newest="$(printf '%s\n%s\n' "$latest" "$tag" | sort -V | tail -1)"
          if [ "$newest" != "$tag" ]; then
            printf '%s is not newer than the published %s\n' "$tag" "$latest" >&2
            exit 1
          fi

      - name: Merge and sign the manifest
        env:
          SIGNING_KEY: ${{ secrets.SCREENROOM_ED25519_KEY }}
        run: |
          if [ -n "${SIGNING_KEY:-}" ]; then
            key_file="$RUNNER_TEMP/screenroom-ed25519"
            remove_key() { rm -f "$key_file"; }
            trap remove_key EXIT INT TERM
            umask 077
            printf '%s\n' "$SIGNING_KEY" >"$key_file"
            chmod 600 "$key_file"
            SCREENROOM_SIGNING_KEY_FILE="$key_file" scripts/release.sh manifest --out artifacts
            remove_key
            trap - EXIT INT TERM
          else
            scripts/release.sh manifest --out artifacts
          fi

      - name: Publish the GitHub release without replacing published bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(scripts/release.sh version)"
          tag="v$version"
          files=()
          for candidate in artifacts/*macos*.zip artifacts/appcast.xml artifacts/manifest.json artifacts/manifest.json.sig artifacts/Screenroom-media-source.tar.xz; do
            if [ -f "$candidate" ]; then
              files+=("$candidate")
            fi
          done
          [ "${#files[@]}" -gt 0 ] || { printf 'nothing to publish\n' >&2; exit 1; }
          notes="Screenroom $version, built from $GITHUB_SHA on $GITHUB_REF_NAME."
          if ! gh release view "$tag" >/dev/null 2>&1; then
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              gh release create "$tag" "${files[@]}" --title "Screenroom $version" --notes "$notes"
            else
              gh release create "$tag" "${files[@]}" --title "Screenroom $version" --notes "$notes" --target "$GITHUB_SHA"
            fi
            exit 0
          fi
          missing=()
          for file in "${files[@]}"; do
            name="$(basename "$file")"
            if gh release view "$tag" --json assets --jq '.assets[].name' | grep -qx "$name"; then
              scratch="$RUNNER_TEMP/published-$name"
              rm -rf "$scratch"
              mkdir -p "$scratch"
              gh release download "$tag" --pattern "$name" --dir "$scratch"
              if ! cmp -s "$file" "$scratch/$name"; then
                printf 'refusing to overwrite %s: the published asset is different\n' "$name" >&2
                exit 1
              fi
              printf '%s is already published and identical\n' "$name"
            else
              missing+=("$file")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            gh release upload "$tag" "${missing[@]}"
          fi
