name: CI (Linux)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:

  rust-fmt-clippy:
    name: Rust format, clippy and secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

          fetch-depth: 0

      - name: Install rustfmt and clippy
        run: rustup component add rustfmt clippy

      - name: Cache the cargo registry and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-lint-
            ${{ runner.os }}-cargo-

      - name: Verify formatting
        run: cargo fmt --all --check

      - name: Clippy, warnings are errors
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Install gitleaks (pinned release, checksum verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$RUNNER_TEMP/$archive" \
            | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar --extract --gzip --file "$RUNNER_TEMP/$archive" \
            --directory "$RUNNER_TEMP/gitleaks" gitleaks
          printf '%s\n' "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      - name: Scan the history for committed secrets
        run: gitleaks git --no-banner --redact --verbose .

  rust-test:
    name: Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:

      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install the system dependencies the tests use
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg libmpv-dev

      - name: Cache the cargo registry and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
            ${{ runner.os }}-cargo-

      - name: Give libmpv a headless audio sink
        run: |
          sudo tee /etc/asound.conf >/dev/null <<'EOF'
          pcm.!default { type null }
          ctl.!default { type null }
          EOF
          mkdir -p "$RUNNER_TEMP/runtime"
          chmod 700 "$RUNNER_TEMP/runtime"
          echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/runtime" >> "$GITHUB_ENV"

      - name: Run the core and player tests
        run: |
          cargo test --workspace --all-targets --exclude screenroom-desktop \
            --no-fail-fast -- \
            --skip audio_is_consumed_in_real_time_without_drifting \
            --skip resume_position_is_honoured_when_loading

      - name: Run the desktop tests one at a time
        run: |
          cargo test -p screenroom-desktop --all-targets --no-fail-fast -- \
            --test-threads=1 \
            --skip step_10_quitting_mid_film_and_reopening_resumes_within_a_second \
            --skip step_12_a_folder_that_disappears_keeps_history_and_a_rescan_recovers_it \
            --skip a_tool_is_found_outside_a_minimal_launch_path \
            --skip step_1_a_first_run_scan_fills_the_grid_before_it_finishes

  tv-tests:
    name: TV client tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/tv
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install --global pnpm@12.16.1

      - name: Install dependencies from the lockfile
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Run the tests
        run: pnpm test
