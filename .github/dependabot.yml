version: 2

updates:
  # Keep the pinned workflow actions current. The workflow pins exact SHAs, so
  # a Dependabot bump is the only way they move.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    open-pull-requests-limit: 5

  # `apps/tv` is the only npm/pnpm manifest in the repository.
  - package-ecosystem: npm
    directory: /apps/tv
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    open-pull-requests-limit: 5
