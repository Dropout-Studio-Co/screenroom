[package]
name = "screenroom-desktop"
description = "Screenroom macOS/Windows desktop client (iced + wgpu + libmpv)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
screenroom-core = { path = "../../crates/screenroom-core" }
screenroom-player = { path = "../../crates/screenroom-player" }

iced = { version = "0.14", features = ["wgpu", "image"] }

wgpu = "27"

[target.'cfg(target_os = "macos")'.dependencies]

rfd = "0.15"

objc2 = "0.6"

metal = "0.32"

[dev-dependencies]
tempfile.workspace = true

serde_json.workspace = true
